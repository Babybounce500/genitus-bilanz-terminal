<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENITUS BILANZ-TERMINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#f4f7fb;--surface:#ffffff;--panel:#ffffff;--border:#d9e2ec;--accent:#0e7490;--gold:#b45309;--green:#15803d;--red:#b91c1c;--muted:#52606d;--text:#1e293b;--bright:#0f172a;--mono:'Space Mono',monospace;--sans:'Rajdhani',sans-serif;}
    :root.dark-theme{--bg:#080c10;--surface:#0d1117;--panel:#111820;--border:#1e2d3d;--accent:#00d4ff;--gold:#f0c040;--green:#00ff88;--red:#ff3b5c;--muted:#7d92a8;--text:#c8d8e8;--bright:#ffffff;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100vh;transition:background .25s,color .25s;}
    header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200;}
    .logo{display:flex;align-items:center;gap:12px;}
    .logo-mark{width:32px;height:32px;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;color:var(--gold);}
    .logo-text{font-family:var(--mono);font-size:13px;letter-spacing:3px;color:var(--bright);}
    .logo-sub{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);display:block;margin-top:1px;}
    #themeToggleBtn{background:none;border:1px solid var(--border);color:var(--accent);width:30px;height:30px;border-radius:2px;cursor:pointer;font-size:14px;}
    .live-badge{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:3px 8px;border:1px solid var(--green);color:var(--green);border-radius:2px;text-transform:uppercase;}
    .layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 56px);}
    @media(max-width:900px){.layout{grid-template-columns:1fr;}}
    .picker-panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:10px;overflow-y:auto;max-height:calc(100vh - 56px);}
    .field-label{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;display:block;}
    select,input[type="text"]{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:8px 10px;outline:none;border-radius:2px;}
    .index-tabs{display:flex;gap:6px;}
    .index-tab{flex:1;font-family:var(--mono);font-size:11px;padding:8px;text-align:center;border:1px solid var(--border);border-radius:2px;cursor:pointer;color:var(--muted);}
    .index-tab.active{background:rgba(180,83,9,0.12);border-color:var(--gold);color:var(--gold);}
    .picker-list{flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:2px;min-height:300px;}
    .picker-item{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px;}
    .picker-item:hover{background:rgba(180,83,9,0.08);}
    .picker-item .sym{font-family:var(--mono);color:var(--accent);font-weight:700;}
    .picker-item .nm{color:var(--muted);font-size:11px;display:block;}
    .picker-empty{padding:30px 10px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;}
    .main-panel{padding:18px;overflow-y:auto;}
    .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--muted);font-family:var(--mono);font-size:12px;gap:10px;text-align:center;}
    .welcome .big{font-size:32px;opacity:.4;}
    .analysis-title{font-family:var(--mono);font-size:16px;color:var(--gold);letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
    .health-hero{display:flex;align-items:center;gap:20px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:16px 20px;margin-bottom:18px;}
    .health-score{font-family:var(--mono);font-size:42px;font-weight:700;}
    .health-sub{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
    .health-sub .hs-box{text-align:center;}
    .health-sub .hs-lbl{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
    .health-sub .hs-val{font-family:var(--mono);font-size:15px;font-weight:700;}
    .panel-block{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:14px;margin-bottom:16px;}
    .panel-block h3{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;}
    .panel-block p.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    th{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);}
    th:first-child{text-align:left;}
    td{padding:6px 8px;border-bottom:1px solid rgba(125,146,168,0.15);text-align:right;font-family:var(--mono);font-size:11px;}
    td:first-child{text-align:left;font-family:var(--sans);font-size:12px;color:var(--muted);}
    .ratio-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
    @media(max-width:700px){.ratio-grid{grid-template-columns:repeat(2,1fr);}}
    .ratio-box{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:8px 10px;}
    .ratio-box .rlbl{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;}
    .ratio-box .rval{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--bright);}
    .chart-wrap{height:260px;position:relative;}
    .loading-line{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding:40px;}
    .spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .disclaimer{font-size:10px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:10px;margin-top:6px;}
  </style>
</head>

  // ── Ported 1:1 from core/fundamental.py _ROW_ALIASES / pick_row / latest ──
  const ROW_ALIASES = {
    total_revenue: ["Total Revenue","TotalRevenue","Revenue","Total revenue"],
    gross_profit: ["Gross Profit","GrossProfit"],
    operating_income: ["Operating Income","OperatingIncome","Operating Income or Loss"],

    inventory: ["Inventory"],

    total_liabilities: ["Total Liabilities Net Minority Interest","Total Liab","Total Liabilities"],
    total_debt: ["Total Debt","TotalDebt"],

    capex: ["Capital Expenditure","Capital Expenditures","CapitalExpenditure"],
    free_cash_flow: ["Free Cash Flow","FreeCashFlow"],
    dividends_paid: ["Cash Dividends Paid","Dividends Paid","Common Stock Dividend Paid"],

    ppe: ["Net PPE","Property Plant Equipment Net","Net Property Plant And Equipment"],
    goodwill: ["Goodwill","Goodwill And Other Intangible Assets"],
    non_current_liabilities: ["Total Non Current Liabilities Net Minority Interest","Total Non Current Liabilities"],
  };
  function pickRow(rowsObj, key){
    if(!rowsObj) return null;
    const aliases = ROW_ALIASES[key] || [key];
    const lowerMap = {};
    Object.keys(rowsObj).forEach(k=>lowerMap[k.toLowerCase().trim()]=k);
    for(const a of aliases){ const al=a.toLowerCase().trim(); if(lowerMap[al]) return rowsObj[lowerMap[al]]; }
    for(const a of aliases){
      const aTokens = new Set(a.toLowerCase().trim().split(' '));
      for(const [low, real] of Object.entries(lowerMap)){
        const lowTokens = new Set(low.split(' '));
        let subset = true; aTokens.forEach(t=>{ if(!lowTokens.has(t)) subset=false; });
        if(subset) return rowsObj[real];
      }
    }
    return null;
  }
  function latest(arr){ if(!arr) return null; for(const v of arr){ if(v!=null && !isNaN(v)) return v; } return null; }

  function safeDiv(a,b,mult=1){ if(a==null||b==null) return null; if(b===0) return null; return a/b*mult; }

  // ── Ported 1:1 from core/ratios.py compute() ──
  function computeRatios(fin, info){
    const income = fin.income?.rows, balance = fin.balance?.rows, cashflow = fin.cashflow?.rows;
    const revenue = latest(pickRow(income,'total_revenue'));
    const gross = latest(pickRow(income,'gross_profit'));
    const opInc = latest(pickRow(income,'operating_income'));
    const ebitda = latest(pickRow(income,'ebitda'));
    const netInc = latest(pickRow(income,'net_income'));
    const interestExp = latest(pickRow(income,'interest_expense'));
    const totalAssets = latest(pickRow(balance,'total_assets'));
    const curAssets = latest(pickRow(balance,'current_assets'));
    const curLiab = latest(pickRow(balance,'current_liabilities'));
    const inv = latest(pickRow(balance,'inventory')) || 0;
    const cash = latest(pickRow(balance,'cash')) || 0;
    const totalDebt = latest(pickRow(balance,'total_debt'));
    const equity = latest(pickRow(balance,'total_equity'));
    const opCf = latest(pickRow(cashflow,'operating_cf'));
    let fcf = latest(pickRow(cashflow,'free_cash_flow'));
    if(fcf==null){ const cx=latest(pickRow(cashflow,'capex')); if(opCf!=null && cx!=null) fcf = opCf + cx; }
    const taxRate = 0.21;
    const nopat = opInc!=null ? opInc*(1-taxRate) : null;

    const out = {};
    out.gross_margin = safeDiv(gross, revenue, 100);
    out.operating_margin = safeDiv(opInc, revenue, 100);
    out.ebitda_margin = safeDiv(ebitda, revenue, 100);
    out.net_margin = safeDiv(netInc, revenue, 100);
    out.fcf_margin = safeDiv(fcf, revenue, 100);
    out.roa = safeDiv(netInc, totalAssets, 100);
    out.roe = safeDiv(netInc, equity, 100);
    const investedCapital = (equity||0) + (totalDebt||0) - Math.min((cash||0),(totalDebt||0));
    out.roic = safeDiv(nopat, investedCapital>0?investedCapital:null, 100);
    out.current_ratio = safeDiv(curAssets, curLiab);
    out.quick_ratio = (curAssets && curLiab) ? safeDiv(curAssets-inv, curLiab) : null;
    out.cash_ratio = safeDiv(cash, curLiab);
    out.debt_equity = safeDiv(totalDebt, equity);
    out.debt_assets = safeDiv(totalDebt, totalAssets);
    out.equity_ratio = safeDiv(equity, totalAssets, 100);
    out.interest_coverage = safeDiv(opInc, interestExp?Math.abs(interestExp):null);
    out.asset_turnover = safeDiv(revenue, totalAssets);
    out.fcf_to_debt = totalDebt ? safeDiv(fcf, totalDebt) : null;
    out.ocf_to_debt = totalDebt ? safeDiv(opCf, totalDebt) : null;
    out.pe = info?.trailingPE ?? null;
    out.pb = info?.priceToBook ?? null;
    out.ev_ebitda = info?.enterpriseToEbitda ?? null;
    out.beta = info?.beta ?? null;
    out.dividend_yield = (typeof info?.dividendYield==='number') ? info.dividendYield : null;
    out.payout_ratio = info?.payoutRatio ? info.payoutRatio*100 : null;
    return out;
  }
  function clip(v,lo=0,hi=100){ return Math.max(lo,Math.min(hi,v)); }
  function scoreProfitability(r){ let s=0,n=0; if(r.net_margin!=null){s+=clip(50+r.net_margin*2);n++;} if(r.roe!=null){s+=clip(40+r.roe*2);n++;} if(r.roic!=null){s+=clip(40+r.roic*2.5);n++;} return n?s/n:50; }
  function scoreLiquidity(r){ const s=[]; if(r.current_ratio!=null){ if(r.current_ratio>=2)s.push(85); else if(r.current_ratio>=1.5)s.push(75); else if(r.current_ratio>=1)s.push(60); else if(r.current_ratio>=0.7)s.push(40); else s.push(20);} if(r.quick_ratio!=null){ if(r.quick_ratio>=1.5)s.push(85); else if(r.quick_ratio>=1)s.push(70); else if(r.quick_ratio>=0.7)s.push(55); else s.push(35);} return s.length?s.reduce((a,b)=>a+b,0)/s.length:50; }
  function scoreLeverage(r){ const s=[]; if(r.debt_equity!=null){ if(r.debt_equity<0.3)s.push(90); else if(r.debt_equity<0.6)s.push(80); else if(r.debt_equity<1)s.push(65); else if(r.debt_equity<2)s.push(45); else s.push(25);} if(r.interest_coverage!=null){ if(r.interest_coverage>10)s.push(90); else if(r.interest_coverage>5)s.push(75); else if(r.interest_coverage>2)s.push(55); else if(r.interest_coverage>1)s.push(35); else s.push(15);} if(r.equity_ratio!=null) s.push(clip(r.equity_ratio+30)); return s.length?s.reduce((a,b)=>a+b,0)/s.length:50; }
  function scoreEfficiency(r){ const s=[]; if(r.asset_turnover!=null){ if(r.asset_turnover>1.5)s.push(85); else if(r.asset_turnover>1)s.push(75); else if(r.asset_turnover>0.6)s.push(60); else if(r.asset_turnover>0.3)s.push(45); else s.push(30);} if(r.fcf_margin!=null) s.push(clip(50+r.fcf_margin*2.5)); return s.length?s.reduce((a,b)=>a+b,0)/s.length:50; }
  function scoreValuation(r){ const s=[]; if(r.pe!=null&&r.pe>0){ if(r.pe<12)s.push(85); else if(r.pe<18)s.push(75); else if(r.pe<25)s.push(60); else if(r.pe<40)s.push(45); else s.push(25);} if(r.pb!=null&&r.pb>0){ if(r.pb<1.5)s.push(85); else if(r.pb<3)s.push(70); else if(r.pb<5)s.push(55); else s.push(35);} if(r.ev_ebitda!=null&&r.ev_ebitda>0){ if(r.ev_ebitda<10)s.push(85); else if(r.ev_ebitda<15)s.push(70); else if(r.ev_ebitda<25)s.push(55); else s.push(35);} return s.length?s.reduce((a,b)=>a+b,0)/s.length:50; }
  function healthScore(r){
    const sub = { 'Profitabilität':scoreProfitability(r), 'Liquidität':scoreLiquidity(r), 'Verschuldung':scoreLeverage(r), 'Effizienz':scoreEfficiency(r), 'Bewertung':scoreValuation(r) };
    const weights = { 'Profitabilität':0.30, 'Liquidität':0.15, 'Verschuldung':0.20, 'Effizienz':0.15, 'Bewertung':0.20 };
    let total=0; Object.keys(sub).forEach(k=>total+=sub[k]*weights[k]);
    return { total: Math.round(total), sub };
  }

  function fmtBig(n){
    if(n==null) return '—';
    const abs=Math.abs(n);
    if(abs>=1e9) return (n/1e9).toFixed(2)+'B';
    if(abs>=1e6) return (n/1e6).toFixed(2)+'M';
    return n.toFixed(2);
  }
  function fmtPct(n,d=1){ return n==null?'—':n.toFixed(d)+'%'; }
  function fmtRatio(n,d=2){ return n==null?'—':n.toFixed(d); }

  function buildStatementRows(rowsObj, cols, labels){
    return labels.map(([label,key])=>{
      const s = pickRow(rowsObj, key);
      return { label, values: cols.map((c,i)=> s ? s[i] : null) };
    });
  }

          <div class="ratio-box"><div class="rlbl">Zinsdeckung</div><div class="rval">${fmtRatio(ratios.interest_coverage)}x</div></div>
          <div class="ratio-box"><div class="rlbl">Eigenkapitalquote</div><div class="rval">${fmtPct(ratios.equity_ratio)}</div></div>
          <div class="ratio-box"><div class="rlbl">KGV (Trailing)</div><div class="rval">${fmtRatio(ratios.pe)}</div></div>
          <div class="ratio-box"><div class="rlbl">KBV</div><div class="rval">${fmtRatio(ratios.pb)}</div></div>
          <div class="ratio-box"><div class="rlbl">EV/EBITDA</div><div class="rval">${fmtRatio(ratios.ev_ebitda)}</div></div>
        </div>
      </div>

      <div class="panel-block">
        <h3>Health-Score Radar</h3>
        <div class="chart-wrap"><canvas id="radarChart"></canvas></div>
      </div>

      <div class="panel-block">
        <h3>Gewinn- und Verlustrechnung (jährlich)</h3>
        ${statTable(incCols, incRows)}
      </div>
      <div class="panel-block">
        <h3>Bilanz (jährlich)</h3>
        ${statTable(balCols, balRows)}
      </div>
      <div class="panel-block">
        <h3>Cashflow-Rechnung (jährlich)</h3>
        ${statTable(cfCols, cfRows)}
        <div class="disclaimer">Alle Werte live von Yahoo Finance über Daniels StockSentinel-Proxy, Ratio-Formeln und Health-Score-Gewichtung 1:1 aus <code>core/ratios.py</code> übernommen (Profitabilität 30%, Liquidität 15%, Verschuldung 20%, Effizienz 15%, Bewertung 20%). Historische Bilanzanalyse, keine Prognose, keine Anlageberatung.</div>
      </div>
    `;

    const ctx = document.getElementById('radarChart').getContext('2d');
    if(radarChartInst) radarChartInst.destroy();
    radarChartInst = new Chart(ctx, {
      type:'radar',
      data:{ labels: Object.keys(health.sub), datasets:[{ label:sym, data:Object.values(health.sub), backgroundColor:'rgba(240,192,64,0.25)', borderColor:'#f0c040', pointBackgroundColor:'#f0c040' }] },
      options:{ responsive:true, maintainAspectRatio:false,
        scales:{ r:{ min:0, max:100, ticks:{ color:'#7d92a8', backdropColor:'transparent', font:{size:8} }, grid:{ color:'rgba(125,146,168,0.2)' }, angleLines:{ color:'rgba(125,146,168,0.2)' }, pointLabels:{ color:'#7d92a8', font:{family:'Space Mono',size:10} } } },
        plugins:{ legend:{display:false} }
      }
    });
  }

  renderPicker();
</script>
</body>
</html>
